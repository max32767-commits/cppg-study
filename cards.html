<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1115">
<title>CPPG 숫자 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 쇼츠형 세로 카드 한 장이 화면을 채움. 위로 스와이프/↓키로 다음, 탭으로 뒤집기. 카테고리별 배경색이 카드의 유일한 장식. */
:root{
  --bg:#0F1115; --fg:#F4F4F2; --muted:#9BA0A8; --card:#1A1D23; --line:#2A2E36;
  --accent:#FFB400; --ok:#43C59E; --bad:#FF6B6B;
  --c기한:#1E3A5F; --c인원:#2F4858; --c금액:#4A3728; --c비율:#3A2E5C; --c주체:#1F4D3A; --c개념:#4B2A3F; --c기술:#2B3A4B;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F2EE; --fg:#15171C; --muted:#5F646D; --card:#FFFFFF; --line:#E0DFD9; --accent:#C97A00;
  --c기한:#D9E6F5; --c인원:#DCE8EC; --c금액:#F3E6D6; --c비율:#E6DEF5; --c주체:#D8EEE2; --c개념:#F0DCE8; --c기술:#DEE6EF; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F3F2EE; --fg:#15171C; --muted:#5F646D; --card:#FFFFFF; --line:#E0DFD9; --accent:#C97A00;
  --c기한:#D9E6F5; --c인원:#DCE8EC; --c금액:#F3E6D6; --c비율:#E6DEF5; --c주체:#D8EEE2; --c개념:#F0DCE8; --c기술:#DEE6EF; color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.top select,.top button{font-family:inherit;font-size:12px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.top button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.bar{height:3px;background:var(--line);border-radius:2px;margin:8px 0 10px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stage{flex:1;position:relative;perspective:1200px;min-height:0}
.card{position:absolute;inset:0;border-radius:24px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;cursor:pointer;will-change:transform}
.card.flip{transform:rotateY(180deg)}
.card.out-up{transform:translateY(-110%) rotate(-3deg);opacity:0}
.card.out-down{transform:translateY(110%) rotate(3deg);opacity:0}
.face{position:absolute;inset:0;border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line)}
.back{transform:rotateY(180deg)}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tag b{color:var(--fg);font-weight:500}
.q{flex:1;display:flex;align-items:center;font-size:clamp(22px,5.5vw,30px);font-weight:700;line-height:1.35;text-wrap:balance;word-break:keep-all}
.hint{font-size:13px;color:var(--muted);text-align:center}
.a{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.a .big{font-size:clamp(26px,7vw,40px);font-weight:900;line-height:1.25;word-break:keep-all;text-wrap:balance;color:var(--accent)}
.a .q2{font-size:14px;color:var(--muted);line-height:1.5}
.trap{border-top:1px solid var(--line);padding-top:12px;font-size:14px;line-height:1.55;color:var(--fg)}
.trap::before{content:"함정 ";font-family:var(--mono);font-size:11px;color:var(--bad);letter-spacing:.1em}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ctrl button{font-family:inherit;font-size:15px;font-weight:700;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.ctrl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctrl .know{color:var(--ok)}.ctrl .miss{color:var(--bad)}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:24px;background:var(--card);border:1px solid var(--line);padding:24px}
.done .n{font-family:var(--mono);font-size:44px;font-weight:700}
.done button{font-family:inherit;font-size:15px;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
@media (prefers-reduced-motion:reduce){.card,.bar>i{transition:none}}
</style></head><body>

<div class="app">
  <div class="top">
    <span id="pos">0 / 0</span>
    <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <select id="cat" aria-label="범주"><option value="">전체</option><option>기한</option><option>인원</option><option>금액</option><option>비율</option><option>주체</option><option>개념</option><option>기술</option></select>
      <button id="missOnly" aria-pressed="false" title="틀린 카드만">틀린 것만</button>
      <button id="auto" aria-pressed="false" title="자동 넘김">자동</button>
      <button id="tts" aria-pressed="false" title="읽어주기">🔊</button>
    </span>
  </div>
  <div class="bar"><i id="barI"></i></div>
  <div class="stage" id="stage"></div>
  <div class="ctrl">
    <button class="miss" id="bMiss">몰랐다</button>
    <button id="bFlip">뒤집기</button>
    <button class="know" id="bKnow">알았다</button>
  </div>
</div>

<script>
// CPPG 카드 — 앞면: 질문 / 뒷면: 정답 + 함정. 법령 기준 2026.10.25

<script>
(function(){
const ALL=window.CPPG_CARDS||[]; const $=id=>document.getElementById(id);
const KEY='cppg_cards_v1'; let st={miss:{},seen:{},cat:'',missOnly:false,tts:false};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const keyOf=c=>c.q;
let deck=[],i=0,flipped=false,autoT=null,el=null;

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function build(){
  let d=ALL.filter(c=>!st.cat||c.c===st.cat);
  if(st.missOnly) d=d.filter(c=>st.miss[keyOf(c)]);
  // 틀린 카드와 안 본 카드를 앞쪽으로
  d=shuffle(d).sort((a,b)=>(st.miss[keyOf(b)]?2:!st.seen[keyOf(b)]?1:0)-(st.miss[keyOf(a)]?2:!st.seen[keyOf(a)]?1:0));
  deck=d;i=0;render();
}
function render(dir){
  const stage=$('stage'); const old=el;
  if(old&&dir){old.classList.add(dir==='next'?'out-up':'out-down');setTimeout(()=>old.remove(),350)} else stage.innerHTML='';
  $('pos').textContent=(Math.min(i+1,deck.length))+' / '+deck.length;
  $('barI').style.width=(deck.length?i/deck.length*100:0)+'%';
  if(i>=deck.length){ el=document.createElement('div'); el.className='done';
    const missed=deck.filter(c=>st.miss[keyOf(c)]).length;
    el.innerHTML='<div class="tag">한 바퀴 끝</div><div class="n">'+(deck.length-missed)+'<span style="font-size:20px;color:var(--muted)"> / '+deck.length+'</span></div><div style="color:var(--muted)">틀린 카드 '+missed+'장</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button id="again">다시 섞기</button>'+(missed?'<button id="onlyMiss">틀린 것만 돌리기</button>':'')+'</div>';
    stage.appendChild(el); $('again').onclick=build; const om=$('onlyMiss'); if(om) om.onclick=()=>{st.missOnly=true;$('missOnly').setAttribute('aria-pressed','true');save();build()};
    stopAuto(); return; }
  const c=deck[i]; flipped=false;
  el=document.createElement('div'); el.className='card'; el.setAttribute('role','button'); el.setAttribute('aria-label','카드 뒤집기');
  const bg='var(--c'+c.c+')';
  el.innerHTML=`<div class="face front" style="background:${bg}"><div class="tag"><span>${c.c}</span><b>${st.miss[keyOf(c)]?'✕ 틀렸던 카드':''}</b></div><div class="q">${esc(c.q)}</div><div class="hint">탭하면 정답 · 위로 밀면 다음</div></div>
  <div class="face back" style="background:${bg}"><div class="tag"><span>${c.c}</span><b>정답</b></div><div class="a"><div class="q2">${esc(c.q)}</div><div class="big">${esc(c.a)}</div></div><div class="trap">${esc(c.t)}</div></div>`;
  el.onclick=flip; stage.appendChild(el);
  st.seen[keyOf(c)]=1; save();
  if(st.tts) speak(c.q);
}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function flip(){ if(!el||i>=deck.length) return; flipped=!flipped; el.classList.toggle('flip',flipped); if(flipped&&st.tts) speak(deck[i].a+'. '+deck[i].t); }
function mark(know){ if(i>=deck.length) return; const k=keyOf(deck[i]); if(know) delete st.miss[k]; else st.miss[k]=1; save(); next(); }
function next(){ if(i>=deck.length) return; i++; render('next'); }
function prev(){ if(i<=0) return; i--; render('prev'); }
$('bFlip').onclick=flip; $('bKnow').onclick=()=>mark(true); $('bMiss').onclick=()=>mark(false);
$('cat').value=st.cat; $('cat').onchange=e=>{st.cat=e.target.value;save();build()};
$('missOnly').setAttribute('aria-pressed',st.missOnly); $('missOnly').onclick=()=>{st.missOnly=!st.missOnly;$('missOnly').setAttribute('aria-pressed',st.missOnly);save();build()};
$('tts').setAttribute('aria-pressed',st.tts); $('tts').onclick=()=>{st.tts=!st.tts;$('tts').setAttribute('aria-pressed',st.tts);save(); if(!st.tts) window.speechSynthesis&&speechSynthesis.cancel();};
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/[·→✕]/g,' ')); u.lang='ko-KR'; const v=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)); const p=v.find(x=>/Natural|Neural|Google|Yuna/.test(x.name))||v[0]; if(p) u.voice=p; speechSynthesis.speak(u);}catch(e){} }
// 자동 넘김: 앞면 4초 → 뒤집기 → 6초 → 다음
function startAuto(){ stopAuto(); const step=()=>{ if(i>=deck.length){stopAuto();return} if(!flipped){flip();autoT=setTimeout(step,6000)} else {next();autoT=setTimeout(step,4000)} }; autoT=setTimeout(step,4000); }
function stopAuto(){ clearTimeout(autoT); autoT=null; $('auto').setAttribute('aria-pressed','false'); }
$('auto').onclick=()=>{ if(autoT) stopAuto(); else {$('auto').setAttribute('aria-pressed','true'); startAuto();} };
// 스와이프
let y0=null,x0=null; const stage=$('stage');
stage.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;x0=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{ if(y0==null) return; const dy=e.changedTouches[0].clientY-y0, dx=e.changedTouches[0].clientX-x0; y0=null; if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)){ dy<0?next():prev(); } else if(Math.abs(dx)>80){ mark(dx>0); } });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return; if(e.code==='Space'||e.key==='Enter'){e.preventDefault();flip()} else if(e.key==='ArrowDown'||e.key==='ArrowRight'){next()} else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){prev()} else if(e.key==='1'){mark(false)} else if(e.key==='2'){mark(true)} });
build();
})();
</script>
