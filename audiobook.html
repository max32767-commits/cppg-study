<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E6E6A">
<title>CPPG 합격 노트 오디오북</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 플레이어(상단 고정 카드) + 챕터/대본(아래). 한 컬럼, 최대 760px. 포인트 색은 재생 버튼·현재 문장에만. */
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --fg:#1B1D22; --muted:#6E7177; --line:#E1E0DA;
  --accent:#0E6E6A; --accent-fg:#FFFFFF; --accent-soft:#DDEFEE; --now:#FFF4CC;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171B; --card:#1E2126; --fg:#ECEDEF; --muted:#9A9EA6; --line:#2E323A;
  --accent:#3FB8B2; --accent-fg:#0E1A19; --accent-soft:#1C3634; --now:#3A3420; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171B; --card:#1E2126; --fg:#ECEDEF; --muted:#9A9EA6; --line:#2E323A;
  --accent:#3FB8B2; --accent-fg:#0E1A19; --accent-soft:#1C3634; --now:#3A3420; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 16px}

.player{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.np-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.np-title{font-weight:700;font-size:17px;margin:2px 0 10px;min-height:1.6em}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;cursor:pointer}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;min-width:0}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:0;font-size:26px;display:grid;place-items:center}
button.icon{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:18px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:13px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px;min-width:0}
select{font-family:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:220px}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.speed button{border:0;border-radius:0;padding:6px 10px;font-family:var(--mono);font-size:12px}
.speed button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.notice{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--fg);font-size:13px;line-height:1.5}

h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px;font-family:var(--mono);font-weight:500}
.chapters{display:grid;gap:6px}
.ch{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.ch .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ch .t{font-weight:500;min-width:0}
.ch .d{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ch.done .n::after{content:" ✓";color:var(--accent)}

.script{display:grid;gap:4px}
.p{padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--fg);line-height:1.75;border:1px solid transparent}
.p:hover{border-color:var(--line)}
.p[aria-current="true"]{background:var(--now);border-color:transparent}
.p .ix{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:8px}
@media (prefers-reduced-motion:reduce){.prog>i{transition:none}}
@media (max-width:480px){.player{padding:12px}.np-title{font-size:15px}}
</style></head><body>

<div class="wrap">
  <h1>CPPG 합격 필수 노트 — 오디오북</h1>
  <p class="sub">내장 한국어 음성으로 읽어 드립니다. 9개 장 · 법령 기준 2026.10.25 · 들은 위치는 이 기기에 저장됩니다.</p>

  <section class="player" aria-label="플레이어">
    <div class="np-label" id="npLabel">준비</div>
    <div class="np-title" id="npTitle">장을 고르거나 재생을 누르세요</div>
    <div class="prog" id="prog" role="slider" aria-label="진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
    <div class="times"><span id="tCur">0:00</span><span id="tTot">0:00</span></div>
    <div class="ctrls">
      <button class="icon" id="bPrevCh" title="이전 장" aria-label="이전 장">⏮</button>
      <button class="icon" id="bPrev" title="이전 문단" aria-label="이전 문단">◀︎</button>
      <button class="play" id="bPlay" aria-label="재생">▶</button>
      <button class="icon" id="bNext" title="다음 문단" aria-label="다음 문단">▶︎</button>
      <button class="icon" id="bNextCh" title="다음 장" aria-label="다음 장">⏭</button>
    </div>
    <div class="opts">
      <span class="speed" role="group" aria-label="배속">
        <button data-r="0.8">0.8×</button><button data-r="1" aria-pressed="true">1.0×</button><button data-r="1.2">1.2×</button><button data-r="1.4">1.4×</button><button data-r="1.6">1.6×</button>
      </span>
      <label>음성 <select id="voice" aria-label="음성 선택"></select></label>
      <label><input type="checkbox" id="auto" checked> 다음 장 자동 재생</label>
    </div>
    <div class="notice" id="notice" hidden></div>
  </section>

  <h2>장 목록</h2>
  <div class="chapters" id="chapters"></div>

  <h2 id="scriptHead">대본</h2>
  <div class="script" id="script"></div>
</div>

<script>
// CPPG 합격 필수 노트 — 낭독 대본 (법령 기준 2026.10.25)
// 형식: {title, paras:[문장 단락...]}  — 단락 단위로 음성 합성해 끊김을 막는다.
window.CPPG_AUDIOBOOK = [
{title:"시작하며 — 듣는 법", paras:[
"CPPG, 개인정보관리사 합격 필수 노트 오디오북입니다. 이 오디오북은 2026년 9월 11일 시행된 개정 개인정보 보호법과 같은 날 시행된 개정 시행령, 과징금 고시까지 반영했습니다. 법령 기준일은 2026년 10월 25일입니다.",
"시험은 100문항, 120분, 5지선다입니다. 과목별로 40퍼센트 이상, 총점 60퍼센트 이상이면 합격입니다. 제49회 시험은 2026년 12월 6일 일요일이고, 합격자 발표는 12월 23일입니다.",
"이 오디오북은 숫자와 주체, 기한을 귀로 외우도록 만들었습니다. 출퇴근길에는 전체를 순서대로 들으시고, 시험 전날에는 여덟 번째 장 숫자 총정리와 아홉 번째 장 함정 패턴만 반복해서 들으세요. 틀린 선택지가 어떻게 생겼는지 문장으로 읽어 드리니, 그 문장이 시험지에 보이면 바로 오답으로 지우시면 됩니다."
]},
{title:"1장. 시험 개요와 합격 전략", paras:[
"과목은 다섯 개입니다. 1과목 개인정보보호의 이해 10문항, 2과목 개인정보보호 제도 20문항, 3과목 개인정보 라이프사이클 관리 25문항, 4과목 개인정보의 보호조치 30문항, 5과목 개인정보 관리체계 15문항입니다.",
"과락선은 과목 문항 수의 40퍼센트입니다. 1과목은 4문항, 2과목은 8문항, 3과목은 10문항, 4과목은 12문항, 5과목은 6문항을 넘겨야 합니다. 총점은 60점 이상이어야 합니다.",
"전략은 단순합니다. 4과목 보호조치 30문항과 3과목 라이프사이클 25문항이 전체의 55퍼센트입니다. 이 두 과목에서 70퍼센트 이상 맞히면, 나머지 과목은 과락만 피해도 합격선에 닿습니다.",
"가장 위험한 과목은 1과목입니다. 10문항밖에 없어서 한 문항이 10퍼센트입니다. 네 문항은 반드시 맞혀야 하고, 안전하게는 일곱 문항을 목표로 하세요. 정의와 원칙 문제는 100퍼센트 정답을 목표로 합니다.",
"시간은 문항당 72초입니다. 1회독은 60분 안에 끝내고, 표시해 둔 문항만 두 번째로 봅니다. 한 문제에 3분 이상 쓰지 않습니다.",
"문제의 다수는 옳지 않은 것을 고르는 형식입니다. 선택지 다섯 개 중 네 개는 조문 그대로이고, 하나만 숫자나 주체나 기간을 바꿉니다. 바뀐 한 단어를 찾는 훈련이 곧 점수입니다.",
"법이 바뀐 해에는 신 조문과 구 조문을 섞어서 냅니다. 2026년 12월 시험은 9월 11일 시행 개정법을 묻는 첫 회차에 가깝습니다. 개정 전 내용은 오답 선택지로, 개정 후 내용은 정답으로 나옵니다.",
"공부 순서는 3과목, 4과목, 2과목, 5과목, 1과목 순이 효율적입니다. 3과목이 법의 뼈대이고, 4과목과 5과목은 그 위에 고시와 인증기준이 얹힌 구조라서, 3과목을 먼저 잡으면 나머지가 빨리 붙습니다."
]},
{title:"2장. 1과목 개인정보보호의 이해", paras:[
"1과목은 정의 세 개, 원칙 여덟 개, 권리 여섯 개만 정확하면 10문항 중 8문항은 고정 점수입니다.",
"개인정보의 정의, 법 제2조 제1호입니다. 첫째, 살아 있는 개인에 관한 정보입니다. 사망자, 법인, 단체의 정보는 개인정보가 아닙니다. 둘째, 성명, 주민등록번호, 영상 등으로 개인을 알아볼 수 있는 정보입니다. 셋째, 그 자체로는 알아볼 수 없어도 다른 정보와 쉽게 결합하여 알아볼 수 있는 정보입니다. 쉽게 결합한다는 것은 다른 정보의 입수 가능성과 시간, 비용, 기술을 합리적으로 고려하여 판단합니다. 그리고 가명정보도 개인정보입니다.",
"가명정보는 추가 정보 없이는 특정 개인을 알아볼 수 없도록 처리한 정보이고, 보호법이 적용됩니다. 제28조의2부터 제28조의7까지 특례가 있습니다. 익명정보는 시간, 비용, 기술을 고려할 때 더 이상 개인을 알아볼 수 없는 정보이고, 보호법 적용에서 제외됩니다. 제58조의2입니다.",
"보호 원칙, 제3조에서 출제자가 바꾸는 포인트입니다. 목적에 필요한 최소한의 개인정보를, 적법하고 정당하게 수집합니다. 정확성, 완전성, 최신성을 보장합니다. 사생활 침해를 최소화하는 방법으로 처리합니다. 익명처리가 가능하면 익명으로, 어려우면 가명으로 처리합니다. 이 순서를 바꾼 선택지, 즉 가명이 먼저라고 하는 선택지가 오답입니다. 그리고 책임과 의무를 준수하고 실천하여 정보주체의 신뢰를 얻기 위해 노력합니다.",
"정보주체의 권리, 제4조는 여섯 개입니다. 처리에 관한 정보를 제공받을 권리. 동의 여부와 범위를 선택하고 결정할 권리. 열람과 사본 발급, 그리고 전송을 요구할 권리. 처리정지, 정정, 삭제, 파기를 요구할 권리. 피해를 구제받을 권리. 그리고 2023년에 신설된, 완전히 자동화된 결정을 거부하거나 설명을 요구할 권리입니다.",
"연혁과 국제 규범입니다. 헌법상 근거는 제10조 인간의 존엄과 행복추구권, 그리고 제17조 사생활의 비밀과 자유입니다. 2005년 헌법재판소 지문날인 사건이 개인정보자기결정권을 인정했습니다.",
"OECD 8원칙, 1980년입니다. 수집제한, 정보정확성, 목적명확화, 이용제한, 안전보호, 공개, 개인참가, 책임. 여덟 개입니다.",
"프라이버시 바이 디자인 7원칙은 카보키언이 제안했습니다. 사전예방, 기본설정으로서의 프라이버시, 설계에 내재, 포지티브섬, 종단간 보호, 가시성과 투명성, 사용자 존중입니다. 제로섬이 아니라 포지티브섬이라는 점을 바꿔서 냅니다.",
"데이터 3법은 2020년 8월 5일 시행입니다. 가명정보 도입, 보호위원회의 중앙행정기관 격상, 정보통신망법 조항의 보호법 이관, 결합전문기관 도입이 핵심입니다.",
"2023년 개정은 2023년 9월 15일과 2024년 3월 15일에 나눠 시행됐습니다. 전송요구권, 자동화된 결정에 대한 권리, 이동형 영상기기, 과징금 전체 매출 3퍼센트, 손해배상 5배, 분쟁조정 의무참여 확대가 들어왔습니다.",
"GDPR은 2018년 5월 25일 시행, 과징금은 전 세계 매출 4퍼센트 또는 2천만 유로 중 큰 금액, 침해 시 72시간 내 감독기관 통지입니다. 한국은 2021년 12월 17일 적정성 결정을 받았습니다.",
"프라이버시 개념의 역사입니다. 1890년 워렌과 브랜다이스가 혼자 있을 권리를 말했고, 1967년 웨스틴이 자기정보통제권을 말했습니다."
]},
{title:"3장. 2과목 개인정보보호 제도", paras:[
"2과목은 기관 구성 숫자, 분쟁조정 기한, 제재 금액 세 덩어리가 20문항의 절반을 차지합니다.",
"개인정보 보호위원회는 국무총리 소속 중앙행정기관입니다. 위원장과 부위원장을 포함해 9명이고, 임기는 3년, 한 차례 연임할 수 있습니다. 위원장은 국무회의에 출석해 발언할 수 있습니다.",
"개인정보 보호 기본계획은 보호위원회가 3년마다 수립합니다. 시행계획은 중앙행정기관의 장이 매년 수립합니다. 주체를 바꾼 선택지, 즉 국무총리가 기본계획을 세운다거나 보호위원회가 시행계획을 세운다는 선택지가 오답입니다.",
"공공기관 개인정보 보호수준 평가는 보호위원회가 합니다. 제11조의2로 2023년에 법정화되었고, 종전 이름은 관리수준 진단입니다.",
"개인정보파일 등록은 공공기관만 보호위원회에 합니다. 국가안전, 수사, 내부업무, 영상정보 파일은 제외입니다. 민간도 등록해야 한다는 선택지는 오답입니다.",
"국내대리인은 국내에 주소나 영업소가 없는 자 중에서, 전체 매출 1조 원 이상, 또는 정보통신서비스 매출 100억 원 이상, 또는 일평균 정보주체 100만 명 이상인 자가 지정합니다.",
"분쟁조정입니다. 분쟁조정위원회는 위원장을 포함해 30명 이내입니다. 20명은 구법이고, 9명은 보호위원회 숫자입니다. 조정 기한은 신청일부터 60일 이내이고 연장할 수 있습니다. 조정안을 받은 당사자가 15일 내에 응답하지 않으면 수락한 것으로 봅니다. 거부한 것으로 본다는 선택지는 2023년 개정 전 구법입니다. 조정의 효력은 재판상 화해입니다.",
"분쟁조정 의무 참여 대상은 모든 개인정보처리자입니다. 종전에는 공공기관만이었습니다. 위원회의 사실조사권도 신설됐습니다.",
"집단분쟁조정은 피해 정보주체가 50명 이상이어야 합니다. 신청자는 제외하고 셉니다. 공고 기간은 14일 이상입니다. 국가, 지방자치단체, 소비자원, 소비자단체, 개인정보처리자도 신청할 수 있습니다.",
"단체소송입니다. 소비자단체는 정회원 1천 명 이상, 등록 3년 이상이어야 합니다. 비영리단체는 정보주체 100명 이상의 요청을 받고, 상시 구성원이 5천 명 이상이어야 합니다. 법원의 허가가 필요하고 변호사 강제주의입니다. 청구할 수 있는 것은 권리침해 행위의 금지와 중지만이고, 손해배상은 청구할 수 없습니다. 50명이면 조정, 100명이면 소송으로 외우세요.",
"손해배상입니다. 고의 또는 중과실로 유출등이 발생하면 손해액의 5배 이내에서 징벌적 손해배상이 가능합니다. 3배는 구법입니다. 법정손해배상은 300만 원 이하이고, 손해 입증 없이 청구할 수 있으며, 사실심 변론종결 전까지 청구 변경이 가능합니다. 처리자가 고의와 과실이 없음을 입증하면 면책됩니다.",
"손해배상 보장 의무는 매출 10억 원 이상이면서 일평균 정보주체 1만 명 이상인 처리자에게 있습니다. 보험이나 공제에 가입하거나 준비금을 적립해야 합니다. 1,500억 원과 100만 명으로 올리겠다는 발표는 2025년 3월에 있었지만, 2026년 10월 현재 시행령은 공포되지 않았습니다. 현행은 10억 원, 1만 명입니다.",
"과징금입니다. 일반 과징금, 제64조의2 제1항은 전체 매출액의 3퍼센트 이하입니다. 위반행위와 관련 없는 매출은 제외합니다. 산정이 곤란하면 20억 원 이하입니다. 대표 행위는 동의 없는 수집, 동의 없는 제3자 제공, 목적 외 이용, 안전조치 미흡으로 인한 유출, 가명정보 재식별입니다. 동의 없는 수집은 2023년 개정으로 과태료에서 과징금으로 바뀌었습니다.",
"2026년 9월 11일 신설된 징벌적 과징금, 제64조의2 제2항은 전체 매출액의 10퍼센트 이하, 산정 곤란 시 50억 원 이하입니다. 사유는 고의 또는 중과실로, 첫째 3년 내 반복 위반, 둘째 1천만 명 이상 피해, 셋째 시정명령 불이행으로 유출된 경우입니다. 100만 명이라고 하면 오답입니다.",
"과징금 감경, 제64조의2 제6항도 2026년 신설입니다. 예산, 인력, 설비에 사전 투자한 경우 최대 40퍼센트까지 감경하되, 고의나 중과실은 제외합니다. 과징금 고시 2026-12호의 감경률 상한은 ISMS-P 인증 30퍼센트, 자율규약 20퍼센트, 보호수준평가 15퍼센트입니다. 구 고시의 50, 40, 30퍼센트는 오답입니다.",
"벌칙입니다. 제70조, 10년 이하 징역 또는 1억 원 이하 벌금은 공공기관 개인정보를 변경하거나 말소해 업무를 마비시킨 경우, 그리고 부정하게 취득한 개인정보를 영리 목적으로 제3자에게 제공한 경우입니다.",
"제71조, 5년 이하 징역 또는 5천만 원 이하 벌금은 동의 없는 제3자 제공, 목적 외 이용, 민감정보와 고유식별정보 처리 위반, 업무상 알게 된 개인정보 누설, 가명정보를 재식별 목적으로 처리한 경우입니다.",
"제72조, 3년 이하 징역 또는 3천만 원 이하 벌금은 영상정보처리기기를 임의로 조작하거나 다른 곳을 비추거나 녹음한 경우, 거짓이나 부정한 수단으로 개인정보를 취득한 경우입니다.",
"제73조, 2년 이하 징역 또는 2천만 원 이하 벌금은 정정 삭제 요구에 불응하고 계속 이용하거나 제공한 경우, 처리정지 요구 불응, 자료 제출 거부나 거짓 제출, 검사 거부나 방해입니다. 안전조치 미흡으로 유출한 경우의 형벌은 2023년에 삭제되어 과징금으로 전환되었습니다.",
"과태료입니다. 5천만 원 이하 구간은 현행법에서 두 가지만입니다. 목욕실 같은 금지장소에 고정형 영상기기를 설치한 경우, 그리고 이동형 영상기기로 위반 촬영한 경우입니다. 동의 없는 수집은 5천만 원 과태료라는 선택지는 구법입니다. 현행은 과징금입니다.",
"3천만 원 이하 구간은 14세 미만 아동 법정대리인 동의 위반, 안전조치 의무 위반, 유출 통지와 신고 미이행, 열람 부당 거절, 고정형 기기 설치 사유 위반, 안내판 시정명령 불이행, 그리고 CPO 미지정입니다. CPO 미지정 과태료는 2026년 개정으로 1천만 원에서 3천만 원으로 올라갔고, 이사회 미의결, 보호위원회 미신고도 같은 구간입니다.",
"1천만 원 이하 구간은 처리방침 미공개 같은 경미한 위반입니다. 안내판 미설치 과태료는 2023년에 삭제되어, 시정명령 후 불이행 시 3천만 원으로 바뀌었습니다.",
"적용 제외, 제58조입니다. 제3장부터 제8장까지 적용이 제외되는 것은 국가안전보장 관련 정보 분석, 그리고 언론, 종교단체, 정당의 고유 목적 처리입니다. 통계법에 따른 수집과 공중위생 긴급사항은 2023년에 삭제되었습니다. 공중위생은 제15조의 수집 근거로 옮겨갔습니다. 동창회, 동호회 같은 친목단체는 제15조 수집 동의, 제30조 처리방침, 제31조 CPO 조문만 제외됩니다.",
"금지행위, 제59조는 세 가지입니다. 거짓이나 부정한 수단으로 개인정보를 취득하거나 동의를 받는 행위. 업무상 알게 된 개인정보를 누설하거나 권한 없이 제공하는 행위. 권한 없이 이용, 훼손, 멸실, 변경, 위조, 유출하는 행위. 주체는 처리하거나 처리하였던 자이므로 퇴직자도 포함됩니다."
]},
{title:"4장. 3과목 개인정보 라이프사이클 관리", paras:[
"3과목은 수집 근거 일곱 개, 동의 고지사항 4개 5개 5개, 기한 10일 72시간 30일을 정확히 구분하는 것이 전부입니다.",
"수집 이용의 적법 근거, 제15조 제1항 일곱 가지입니다. 첫째, 정보주체의 동의. 둘째, 법률의 특별한 규정 또는 법령상 의무 준수에 불가피한 경우. 셋째, 공공기관이 법령 등의 소관 업무 수행에 불가피한 경우. 넷째, 정보주체와의 계약 체결과 이행에 필요한 경우. 2023년 개정으로 불가피하게라는 말이 삭제되어 필요한 경우로 완화됐습니다. 다섯째, 급박한 생명, 신체, 재산의 이익에 명백히 필요한 경우. 여섯째, 처리자의 정당한 이익이 정보주체 권리보다 명백히 우선하는 경우. 상당한 관련성과 합리적 범위가 요건입니다. 일곱째, 2023년 신설된, 공중위생 등 공공의 안전과 안녕을 위해 긴급히 필요한 경우입니다.",
"동의 시 고지사항입니다. 수집 이용 동의, 제15조는 네 가지입니다. 목적, 항목, 보유 이용 기간, 동의 거부권과 불이익입니다.",
"제3자 제공 동의, 제17조는 다섯 가지입니다. 받는 자, 받는 자의 목적, 항목, 받는 자의 보유 이용 기간, 거부권과 불이익입니다.",
"국외 이전 동의, 제28조의8도 다섯 가지입니다. 항목, 이전되는 국가와 시기와 방법, 받는 자, 받는 자의 목적과 보유 이용 기간, 거부 방법과 절차와 효과입니다.",
"영업양도, 제27조는 통지 사항 세 가지이고 동의는 필요하지 않습니다. 이전 사실, 양수자의 성명 주소 연락처, 이전을 원하지 않을 때 조치 방법입니다. 수집출처 고지, 제20조도 세 가지입니다. 출처, 처리 목적, 처리정지 요구권입니다.",
"별도 동의가 필요한 것, 제22조입니다. 목적 외 이용 제공, 민감정보, 고유식별정보, 홍보 판매권유, 국외이전입니다. 처리위탁과 영업양도는 동의 대상이 아닙니다. 위탁에 동의가 필요하다는 선택지는 오답입니다.",
"민감정보입니다. 법에는 사상 신념, 노조 정당 가입 탈퇴, 정치적 견해, 건강, 성생활이 있고, 시행령에 유전정보, 범죄경력, 개인 식별 목적의 생체인식정보, 인종 민족 정보가 추가됩니다. 별도 동의 또는 법령의 요구나 허용이 있어야 처리할 수 있습니다. 2023년 신설로, 공개될 가능성이 있으면 비공개 선택 방법을 고지해야 합니다. 주민등록번호는 민감정보가 아니라 고유식별정보입니다.",
"고유식별정보는 네 개뿐입니다. 주민등록번호, 여권번호, 운전면허번호, 외국인등록번호입니다. 신용카드번호와 계좌번호는 고유식별정보가 아닙니다. 별도 동의 또는 법령의 구체적 요구나 허용이 필요하고 암호화해야 합니다. 보호위원회는 공공기관은 1만 명 이상, 민간은 5만 명 이상 처리자에 대해 3년마다 안전조치를 조사합니다. 2024년 3월 시행령 개정 전 구법은 2년이었습니다.",
"주민등록번호는 동의만으로는 처리할 수 없습니다. 법률, 대통령령, 국회 대법원 헌법재판소 선관위 감사원 규칙에서 구체적으로 요구하거나 허용한 경우, 급박한 이익에 명백히 필요한 경우, 보호위원회 고시로 정한 경우 세 가지뿐입니다. 부령이나 조례는 근거가 되지 않습니다. 내부망에 저장해도 암호화 의무가 있고, 인터넷 회원가입 시 주민등록번호 없이 가입할 대체수단을 제공해야 합니다.",
"목적 외 이용 제공, 제18조에서 공공기관만 가능한 사유입니다. 법령상 소관업무 수행에 불가피한 경우, 조약 이행, 범죄 수사와 공소 제기, 법원의 재판, 형과 감호와 보호처분의 집행입니다. 민간은 해당되지 않습니다. 공공기관은 이용 제공 후 30일 내에 관보나 홈페이지에 게재하고, 홈페이지는 10일 이상 게재하며, 대장에 기록합니다.",
"위탁, 제26조입니다. 문서로 하되 목적 외 처리 금지, 보호조치, 목적과 범위, 재위탁 제한, 접근 제한, 관리 감독, 손해배상을 담고, 위탁 업무와 수탁자를 공개합니다. 홍보 판매권유 업무 위탁은 정보주체에게 통지합니다. 재위탁은 2023년부터 위탁자 동의가 필요합니다. 수탁자의 위반은 손해배상에서 위탁자 소속 직원의 행위로 봅니다.",
"제3자 제공과 위탁의 구별은 누구의 업무 목적인가입니다. 받는 자의 목적이면 제공이고 동의가 필요합니다. 위탁자의 목적이면 위탁이고 공개하면 됩니다. 쇼핑몰이 택배사에 주소를 넘기면 위탁, 제휴 보험사에 명단을 넘기면 제3자 제공입니다.",
"가명정보 특례입니다. 동의 없이 처리할 수 있는 목적은 세 가지, 통계작성, 과학적 연구, 공익적 기록보존입니다. 상업적 통계와 산업적 연구도 포함되지만, 마케팅은 안 됩니다. 서로 다른 처리자 간 결합은 결합전문기관이 하고, 반출은 전문기관의 장이 승인합니다. 추가정보는 분리 보관하고, 재식별 가능 정보가 생기면 즉시 처리를 중지하고 회수 파기합니다.",
"가명정보에 적용되지 않는 조문입니다. 제20조 수집출처 고지, 제20조의2 이용내역 통지, 제27조 영업양도, 제34조 제1항 유출 통지, 제35조 열람, 제35조의2 전송, 제36조 정정 삭제, 제37조 처리정지입니다. 그러나 안전조치와 유출 신고는 적용됩니다. 가명정보가 유출되면 신고는 하지만 정보주체 통지는 하지 않는다, 이것이 포인트입니다.",
"국외이전, 제28조의8의 다섯 가지 근거입니다. 별도 동의. 법률이나 조약의 규정. 계약 이행을 위한 위탁과 보관으로서 처리방침에 공개하거나 통지한 경우. 이전받는 자가 보호위원회 고시 인증을 받은 경우. 이전되는 국가의 보호 수준을 보호위원회가 인정한 경우입니다. 이전 중지 명령은 보호위원회가 하고, 이의 제기는 7일 이내입니다. 과기정통부가 중지 명령을 한다는 선택지는 오답입니다.",
"영상정보처리기기입니다. 고정형 설치 사유는 법령 허용, 범죄 예방과 수사, 시설 안전과 화재 예방, 교통단속, 교통정보 수집, 그리고 2023년 추가된 영상을 저장하지 않는 경우입니다. 목욕실, 화장실, 발한실, 탈의실 설치는 금지이고, 교정시설과 정신의료기관은 예외입니다. 임의 조작, 다른 곳 비추기, 녹음은 모두 금지입니다.",
"이동형 영상기기, 제25조의2는 2023년 신설입니다. 제15조의 수집 사유가 있거나, 불빛 소리 안내판으로 촬영 사실을 표시했는데 정보주체가 거부 의사를 밝히지 않은 경우에 촬영할 수 있습니다.",
"정보주체 권리 행사 기한입니다. 열람, 정정 삭제, 처리정지는 모두 10일입니다. 30일은 단골 오답입니다. 공공기관에는 보호위원회를 통해 열람을 요구할 수 있고, 수수료와 우송료를 청구할 수 있습니다. 다른 법령에서 수집 대상으로 명시한 정보는 삭제를 요구할 수 없습니다. 처리정지 거절 사유는 네 개뿐입니다. 법령상 의무, 타인의 생명 신체 이익 침해 우려, 공공기관 소관업무 수행 불가, 계약 이행 곤란인데 정보주체가 해지 의사를 밝히지 않은 경우입니다.",
"수집출처 고지 요구를 받으면 즉시 알려야 합니다. 대규모 처리자, 즉 민감정보나 고유식별정보 5만 명 이상 또는 일반 100만 명 이상 처리자는 요구가 없어도 3개월 내 통지하고, 이용 제공 내역은 연 1회 통지합니다.",
"자동화된 결정, 제37조의2입니다. 권리 의무에 중대한 영향을 미치는 완전히 자동화된 결정은 거부할 수 있습니다. 단, 동의, 법률, 계약에 따른 결정은 거부할 수 없고 설명만 요구할 수 있습니다. 처리자는 기준과 절차를 공개하고, 요구에 30일 내 조치합니다.",
"파기, 제21조입니다. 불필요하게 된 때 지체 없이 파기하고, 표준지침은 5일 이내로 봅니다. 법령에 따라 보존할 때는 다른 개인정보와 분리하여 보관합니다. 1년 미이용자 유효기간제는 2023년 폐지되었습니다.",
"유출등 통지와 신고, 제34조입니다. 2026년 개정으로 유출등에 분실, 도난, 유출 외에 위조, 변조, 훼손이 추가되었습니다. 통지 사항은 다섯 가지, 항목, 시점과 경위, 피해 최소화 방법, 대응조치와 구제절차, 신고 담당부서와 연락처입니다. 2026년 개정으로 유출등 가능성이 있는 항목도 추가됐습니다.",
"통지와 신고 모두 72시간 이내입니다. 24시간은 구 정보통신망법입니다. 2026년 신설된 유출 가능성 통지, 제34조 제2항도 가능성을 알게 된 때부터 72시간 이내입니다. 시행령 제39조의2입니다.",
"신고 대상은 세 가지 중 하나입니다. 1천 명 이상, 민감정보나 고유식별정보는 인원 무관, 해킹 등 외부 불법 접근입니다. 신고처는 보호위원회 또는 한국인터넷진흥원입니다.",
"주의할 함정입니다. 홈페이지 30일 이상 게재는 연락처를 알 수 없는 등 정당한 사유가 있을 때 개별 통지를 갈음하는 방법입니다. 시행령 제39조 제3항입니다. 1천 명 이상이면 홈페이지에 게재한다는 선택지는 오답입니다. 1천 명은 신고 기준이지 게재 요건이 아닙니다.",
"14세 미만 아동은 법정대리인 동의가 필요합니다. 동의를 받기 위한 법정대리인의 성명과 연락처는 아동에게 직접 수집할 수 있고, 아동에게는 쉬운 언어로 고지합니다. 19세 미만 전체라고 하면 오답입니다."
]},
{title:"5장. 4과목 개인정보의 보호조치", paras:[
"4과목은 30문항으로 배점이 가장 큽니다. 개인정보의 안전성 확보조치 기준 숫자가 절반, 암호와 접근통제와 네트워크 보안 개념이 나머지 절반입니다. 21개 이상을 확보합니다.",
"내부 관리계획은 연 1회 이상 이행 점검합니다. 1만 명 미만 보유 소상공인과 개인, 단체는 수립이 면제됩니다. 유형별 차등 적용은 2023년에 폐지되었습니다.",
"접근권한 부여, 변경, 말소 내역은 3년 보관합니다. 접속기록은 기본 1년, 5만 명 이상 또는 고유식별정보나 민감정보 처리 시스템, 기간통신사업자는 2년입니다. 권한 기록 3년과 접속기록 1년을 바꿔서 냅니다. 권한은 사람 일이라 오래 3년, 접속은 로그라 짧게 1년으로 외우세요.",
"접속기록 점검입니다. 2025년 10월 31일 고시 개정으로 월 1회 이상이라는 문구가 삭제되고, 내부 관리계획에 정한 주기와 방법으로 점검하도록 바뀌었습니다. 시행은 2026년 10월 31일이라 12월 시험일에는 이미 시행 중입니다. 다운로드가 발견되면 사유를 확인합니다.",
"접속기록 항목은 계정, 접속일시, 접속지, 처리한 정보주체 정보, 수행업무입니다. 취급자 주민등록번호는 항목이 아닙니다. 보안 프로그램은 자동 업데이트 또는 일 1회 이상 업데이트합니다. 월 1회는 오답입니다. 외부 접속은 인증서, 보안토큰, OTP 등 안전한 인증 수단 또는 VPN이나 전용선을 쓰고, 아이디와 비밀번호만으로는 부족합니다. 인사이동 시 권한은 지체 없이 변경 말소하고, 일정 횟수 인증 실패 시 접근을 제한합니다. 공공시스템 특례는 2024년 9월 15일 시행입니다. 영상정보 보관은 표준 가이드라인상 30일 이내 권고입니다.",
"암호화 매트릭스, 어디에 무엇을 암호화하는가입니다. 주민등록번호는 인터넷 구간, DMZ, 내부망 모두 저장 시 암호화합니다. 여권번호, 운전면허번호, 외국인등록번호는 인터넷 구간과 DMZ는 암호화하고, 내부망은 영향평가나 위험도 분석 결과에 따라 결정합니다. 비밀번호는 일방향 해시에 솔트를 더해 저장합니다. 복호화 가능한 방식으로 저장한다는 선택지는 오답입니다. 생체인식정보는 전송과 저장 모두 암호화합니다. 업무용 PC와 모바일의 고유식별정보는 상용 암호화 소프트웨어나 안전한 알고리즘으로 암호화합니다.",
"안전한 알고리즘입니다. 대칭키는 AES, SEED, ARIA, LEA로 128비트 이상. 공개키는 RSA 2048비트 이상과 ECC. 해시는 SHA-224 이상입니다. 취약한 것은 MD5, SHA-1, DES, RC4, RSA 1024입니다. 공개키는 대칭키보다 느리므로, 공개키로 세션키를 교환하고 대칭키로 데이터를 암호화하는 하이브리드 방식을 씁니다. 공개키가 더 빠르다는 선택지는 오답입니다. 인증서 폐지 확인은 CRL과 OCSP입니다.",
"접근통제 모델입니다. DAC는 소유자 재량, MAC은 보안등급 레이블에 따른 강제, RBAC는 역할 기반으로 조직 표준, ABAC는 속성 기반입니다. 인증 3요소는 지식, 소유, 생체입니다. 비밀번호와 PIN은 둘 다 지식 요소라서 2요소 인증이 아닙니다. 최소권한, 직무분리, 심층방어를 기억하세요. 세션 타임아웃은 접근통제 조치이고 암호화가 아닙니다.",
"네트워크 보안 장비입니다. 방화벽은 IP와 포트 기반 접근통제이고 웹 공격은 막지 못합니다. 웹 방화벽 WAF가 SQL 인젝션과 크로스사이트 스크립팅 같은 웹 계층 공격을 차단합니다. IDS는 탐지와 경고, IPS는 인라인 실시간 차단입니다. 역할을 바꿔서 냅니다. 오탐은 정상을 공격으로 판단하는 것, 미탐은 공격을 놓치는 것입니다. NAC은 단말 네트워크 접근통제, DLP는 내부정보 유출방지, VPN은 암호화 터널입니다. DMZ는 외부와 내부 사이의 공개서버 구역이고, 데이터베이스는 내부망에 둡니다. 망분리는 물리적 분리와 VDI 같은 논리적 분리가 있고, 망분리를 해도 다른 안전조치는 필요합니다.",
"웹 취약점 대응입니다. SQL 인젝션은 프리페어드 스테이트먼트와 입력값 검증. XSS는 출력 인코딩이고, 브라우저에서 실행되므로 DB 암호화와는 무관합니다. CSRF는 예측 불가능한 토큰. 평문 FTP, 텔넷, HTTP는 금지하고 TLS, SFTP, VPN을 씁니다.",
"비식별 기술입니다. 마스킹은 홍길동을 홍 동그라미 동그라미로. 범주화는 33세를 30대로. 총계처리는 부서 평균 급여로 대체. 데이터 삭제는 주민번호 항목 삭제. 무작위화는 순열, 교환, 잡음 추가입니다.",
"프라이버시 보호 모델입니다. k 익명성은 같은 준식별자를 가진 레코드가 k개 이상이어서 연결공격을 막습니다. l 다양성은 민감속성이 l개 이상이어서 동질성 공격과 배경지식 공격을 막습니다. t 근접성은 분포를 유사하게 해서 쏠림 공격과 유사성 공격을 막습니다. k는 개수, l은 다양성, t는 분포로 외우세요.",
"파기입니다. 완전파괴, 디가우저, 덮어쓰기와 초기화가 파기 방법입니다. 휴지통 비우기는 파기가 아닙니다. 일부 파기는 마스킹이나 천공으로 합니다. 백업은 원본과 물리적으로 다른 장소에 둡니다. RPO는 허용 가능한 데이터 손실 시점, RTO는 복구 목표 시간입니다.",
"사고 대응 순서는 인지, 차단과 증거보존, 분석, 72시간 내 통지와 신고, 복구, 재발방지입니다. 로그 삭제는 증거 훼손입니다. 클라우드는 책임 공유 모델이지만 처리자의 법적 책임은 유지되고, 해외 리전은 국외이전을 검토합니다. 생체정보는 변경할 수 없어 유출 피해가 영구적이므로 원본과 템플릿을 분리 보관합니다. 앱 접근권한은 필수와 선택을 구분하고, 선택 권한 미동의로 서비스를 거부할 수 없습니다."
]},
{title:"6장. 5과목 개인정보 관리체계", paras:[
"5과목은 ISMS-P 구조, 영향평가 절차, 위험관리 공식만 알면 15문항 중 11문항은 바로 풀립니다.",
"ISMS-P는 과학기술정보통신부와 개인정보 보호위원회의 공동 고시입니다. 인증기관은 한국인터넷진흥원과 금융보안원이고, 심사기관은 KAIT, TTA, 개인정보보호협회, 차세대정보보안인증원 등입니다.",
"인증기준은 관리체계 수립 및 운영 16개, 보호대책 요구사항 64개, 개인정보 처리단계별 요구사항 21개로 합계 101개입니다. ISMS만 받으면 80개입니다. 관리체계 영역의 네 분야는 1.1 기반 마련, 1.2 위험 관리, 1.3 운영, 1.4 점검 및 개선입니다.",
"유효기간은 3년이고, 사후심사는 매년 1회 이상, 만료 전에 갱신심사를 받습니다. 신청 전 최소 2개월 운영이 필요합니다. 결함 보완조치 기간은 40일이고, 재조치를 요구받으면 60일이 추가되어 최대 100일입니다. 심사원 등급은 심사원보, 심사원, 선임심사원, 책임심사원 네 단계이고 수석심사원은 없습니다.",
"ISMS 의무대상입니다. 서울과 모든 광역시에서 서비스하는 ISP, 집적정보통신시설 IDC 사업자, 연간 매출이나 세입 1,500억 원 이상인 상급종합병원과 재학생 1만 명 이상 학교, 정보통신서비스 부문 매출 100억 원 이상 또는 일평균 이용자 100만 명 이상인 자입니다. 학교 기준은 1만 명이고, CPO 요건의 대학 기준 2만 명과 다릅니다.",
"2026년 개정으로 신설된 제32조의2 개인정보 보호 인증 의무화는 매출과 처리규모가 일정 기준 이상인 처리자에게 적용되며, 시행일은 2027년 7월 1일입니다. 나머지 개정 조문은 2026년 9월 11일 시행이지만 이 조문만 다릅니다.",
"영향평가, 제33조입니다. 공공기관은 의무이고 민간은 노력 의무입니다. 대상 파일은 민감정보나 고유식별정보 5만 명 이상, 다른 파일과 연계 결과 50만 명 이상, 일반 100만 명 이상, 그리고 운용체계 변경으로 위험이 변동된 파일입니다. 민감한 건 오, 연계는 오십, 보통은 백으로 외우세요. 10만 명이라는 기준은 없습니다. 수행은 보호위원회가 지정한 평가기관이 합니다.",
"영향평가서 제출입니다. 평가서는 개인정보파일을 운용하거나 변경하기 전에 보호위원회에 제출합니다. 평가 완료 후 2개월 이내라는 규정은 2023년에 삭제되었으므로, 그 선택지는 구법입니다. 이행점검확인서는 1년 이내에 제출합니다. 2024년 10월 31일 고시 개정으로, 단기에 조치할 수 있는 개선과제는 2개월 이내에 이행결과를 제출합니다. 제출처는 행정안전부가 아니라 보호위원회입니다.",
"절차는 사전준비, 평가수행, 이행 세 단계입니다. 사전준비에서 계획을 세우고 평가기관을 선정하고, 평가수행에서 개인정보 흐름 분석, 침해요인 분석, 개선계획을 만들고, 이행 단계에서 제출과 점검을 합니다. 영향평가를 받은 파일을 등록할 때는 결과를 첨부합니다.",
"위험관리입니다. 위험은 자산, 위협, 취약성의 함수입니다. 취약성이 없으면 위협만으로 위험이 성립하지 않습니다. 처리 전략은 네 개, 감소는 통제 적용, 회피는 활동 중단, 전가는 보험이나 아웃소싱, 수용은 감내입니다. 보험 가입은 전가입니다. 수용 가능한 위험 수준 DoA는 경영진이 승인합니다.",
"위험분석 접근법입니다. 베이스라인은 빠르지만 과다 또는 과소 보호가 생기고, 상세 분석은 정확하지만 비용이 크고, 복합은 핵심 자산만 상세 분석하고, 비정형은 전문가 경험에 의존합니다.",
"정량 분석 공식입니다. 연간 손실 예상액 ALE는 단일 손실 예상액 SLE 곱하기 연간 발생율 ARO입니다. SLE 1억 원에 ARO 0.2이면 ALE는 2천만 원입니다. 정성 분석 기법은 델파이, 시나리오, 순위결정입니다. 델파이는 전문가 익명 설문을 반복해 합의하는 방법입니다.",
"PDCA는 Plan 계획, Do 운영, Check 내부감사와 점검, Act 개선입니다. 내부감사는 Check 단계입니다.",
"개인정보 보호책임자, CPO, 제31조입니다. 업무는 보호계획 수립과 시행, 처리실태 정기 조사와 개선, 불만 처리와 피해 구제, 내부통제시스템 구축, 교육, 개인정보파일 보호와 감독, 처리방침 수립과 변경, 자료 관리, 파기입니다. 서버 구매 계약 같은 것은 CPO 업무가 아닙니다.",
"CPO 전문성 요건 대상입니다. 연 매출 1,800억 원 초과이면서 100만 명 이상 또는 민감정보 고유식별정보 5만 명 이상을 처리하는 자, 재학생 2만 명 이상 대학, 상급종합병원, 공공시스템운영기관입니다. 1,800억 원은 2026년 9월 11일 시행령 개정으로 바뀐 숫자이고, 1,500억 원은 구법입니다. 요건은 개인정보보호, 정보보호, 정보기술 경력을 합산해 4년 이상, 그중 개인정보보호 경력 2년 이상입니다. CPO는 사 이, 4년 2년으로 외우세요.",
"2026년 개정 CPO 조문입니다. 위 기준의 처리자는 CPO를 지정, 변경, 해제할 때 이사회 의결을 거치고 보호위원회에 신고해야 합니다. 신고 기한은 사유 발생일부터 6개월 이내이고 1년 연장이 가능하며, 기존 대상자는 2027년 3월 11일까지, 과태료 계도기간은 2027년 12월 31일까지입니다. CPO에게 전문인력 관리와 예산 확보 권한을 주고, 대표자와 이사회에 보고할 의무가 있습니다. 주주총회 의결이나 국회 보고는 오답입니다. 정당한 이유 없는 불이익은 금지되고, 이해충돌 업무 겸직은 제한됩니다.",
"처리방침, 제30조입니다. 처리 목적, 보유기간, 제3자 제공, 위탁, 파기, 정보주체 권리, 안전조치, CPO의 성명 또는 부서와 연락처, 쿠키 같은 자동수집장치를 기재합니다. 처리방침과 계약 내용이 다르면 정보주체에게 유리한 것을 적용합니다. 처리방침 평가제는 제30조의2로 2023년 신설됐습니다."
]},
{title:"7장. 2026 개정 핫스팟", paras:[
"2026년 3월 10일 공포, 9월 11일 시행된 개정 개인정보 보호법, 법률 제21445호는 12월 시험에서 처음 제대로 질문됩니다. 새 조문은 정답으로, 구 조문은 오답 선택지로 나옵니다. 하나씩 짚습니다.",
"첫째, 제30조의3 신설. 사업주와 대표자가 개인정보 처리와 보호의 최종 책임자입니다. 인력 관리와 예산 확보 등 총괄 관리 조치 의무가 있습니다. 최종 책임자는 CPO다, 라는 선택지는 오답입니다.",
"둘째, 제31조 개정. 매출 1,800억 원 초과에 100만 명 이상 등 일정 기준 처리자의 CPO 지정, 변경, 해제는 이사회 의결과 보호위원회 신고가 필요합니다. 신고는 6개월 내입니다. 국회 동의, 주주총회 의결, 1,500억 원은 오답입니다.",
"셋째, 제32조의2 신설. 일정 기준 이상 처리자의 개인정보 보호 인증 의무화입니다. 시행일은 2027년 7월 1일로, 다른 조문의 2026년 9월 11일과 다릅니다.",
"넷째, 제34조 제1항. 유출등의 정의에 위조, 변조, 훼손이 추가되어 분실, 도난, 유출, 위조, 변조, 훼손 여섯 가지가 됐습니다. 위조나 변조는 통지 대상이 아니라는 선택지는 오답입니다.",
"다섯째, 제34조 제2항 신설, 유출 가능성 통지제. 유출등 가능성을 알게 된 때부터 72시간 이내에 피해 최소화 정보를 통지합니다. 통지 항목에 유출등 가능성이 있는 개인정보 항목이 추가됐습니다. 유출이 확정된 뒤에만 통지한다는 선택지는 오답입니다.",
"여섯째, 제64조의2 제2항 신설, 징벌적 과징금. 전체 매출 10퍼센트, 산정 곤란 시 50억 원입니다. 사유는 고의 중과실로 3년 내 반복, 1천만 명 이상 피해, 시정명령 불이행 유출입니다. 일반 과징금 3퍼센트 20억과 바꿔서 내고, 100만 명이라고 바꿔서 냅니다.",
"일곱째, 제64조의2 제6항 신설, 과징금 감경. 사전 보호투자 시 최대 40퍼센트 감경하되 고의 중과실은 제외합니다. 감경률 상한은 ISMS-P 30퍼센트, 자율규약 20퍼센트, 보호수준평가 15퍼센트입니다. 구 고시의 50, 40, 30퍼센트는 오답입니다.",
"징벌적 과징금의 적용 시점은 부칙에 있습니다. 반복 위반은 시행 후 과징금 처분을 받은 뒤 다시 위반한 경우부터입니다. 1천만 명 피해는 시행 당시 종료되지 않은 위반행위에도 적용됩니다. 시정명령 불이행은 시행 후 명령부터입니다.",
"시행령 개정도 두 번 있었습니다. 2026년 2월 19일 공포, 8월 20일 시행된 시행령은 본인전송요구권을 전 산업 분야로 확대했습니다. 대리인을 통한 요구를 정당한 사유 없이 거절할 수 없고, 대리인은 저장하지 않고 전달만 합니다. 가명정보는 전송요구 대상이 아닙니다. 2026년 9월 10일 공포, 9월 11일 시행된 대통령령 제36671호는 CPO 신고 대상과 절차, 유출 가능성 통지 72시간, 징벌 과징금 산정 기준을 담았습니다.",
"가명정보 처리 가이드라인은 2026년 3월 31일 전부개정되어 위험성 판단 기준이 구체화됐습니다.",
"아직 법이 아닌 것도 알아두세요. 자료보전 명령과 이행강제금, 손해배상책임 강화는 국회 계류 중입니다. 자료보전 명령 제도가 도입되었다는 선택지가 나오면 현행법이 아닙니다. 손해배상 보장 기준 1,500억 원 100만 명 상향도 발표만 되었고 시행령은 공포되지 않았습니다."
]},
{title:"8장. 숫자 총정리", paras:[
"숫자 총정리입니다. 같은 숫자가 여러 조문에 쓰이므로 숫자를 기준으로 모았습니다. 일과 시간, 월과 년, 인원, 금액, 배수와 비율 순서입니다. 숫자를 듣고 어디에 쓰이는지 떠올려 보세요.",
"즉시. 정보주체가 요구하면 수집출처를 즉시 고지합니다. 가명정보에서 재식별 정보가 생성되면 즉시 처리를 중지합니다.",
"5일. 파기의 지체 없이는 표준 개인정보 보호지침에서 5일 이내로 봅니다. 법률이 아니라 지침에 있는 숫자입니다.",
"7일. 국외이전 중지명령에 대한 이의 제기 기간입니다.",
"10일. 열람, 정정 삭제, 처리정지 조치 기한입니다. 공공기관 목적 외 이용의 홈페이지 게재 기간도 10일 이상입니다. 30일은 오답입니다.",
"14일. 집단분쟁조정 개시 공고 기간, 그리고 광고 수신거부 처리결과 통지 기간입니다.",
"15일. 조정안 수락 여부 통지 기한입니다. 무응답은 수락입니다.",
"30일. 공공기관 목적 외 이용의 관보나 홈페이지 게재 기한. 유출 통지를 홈페이지 게재로 갈음할 때의 게시 기간. 자동화된 결정 거부나 설명 요구에 대한 조치 기한. 영상정보 보관 권고 기간. 그리고 CPPG 합격자 발표까지의 기간입니다. 홈페이지 게재 갈음은 연락처 불명 같은 정당한 사유가 요건이고, 1천 명이 요건이 아닙니다.",
"40일과 60일. ISMS-P 심사 결함 보완조치 40일, 재조치 요구 시 60일 추가로 최대 100일입니다.",
"60일. 분쟁조정 심사와 조정안 작성 기한이고, 연장할 수 있습니다. 30일과 90일은 오답입니다.",
"72시간. 유출등 통지, 유출등 신고, 2026년 신설된 유출 가능성 통지, 그리고 GDPR 감독기관 통지가 모두 72시간입니다. 24시간은 구 정보통신망법입니다.",
"밤 9시부터 아침 8시. 야간 광고 전송에 별도 동의가 필요한 시간대입니다. 전자우편은 제외입니다.",
"이제 월과 년입니다. 2개월. 영향평가 단기 개선과제 이행결과 제출 기한, 그리고 ISMS-P 신청 전 최소 운영기간입니다. 영향평가서 완료 후 2개월 제출은 2023년 삭제된 구법이고, 현행은 운용 변경 전 제출입니다.",
"3개월. 대규모 처리자의 수집출처 선제 통지 기한. 국내대리인과 손해배상보장 기준의 직전 3개월 일평균 산정 기간입니다.",
"6개월. CPO 지정 변경 시 보호위원회 신고 기한으로 1년 연장이 가능합니다. 거래관계가 있는 자에게 거래 종료 후 광고를 보낼 수 있는 기간도 6개월입니다.",
"1년. 접속기록 기본 보관. 내부관리계획 이행 점검 주기. 이용 제공 내역 통지 주기. ISMS-P 사후심사 주기. 영향평가 이행점검확인서 제출 기한입니다.",
"2년. 접속기록 확대 보관, 즉 5만 명 이상이나 고유식별 민감정보 처리 시스템이나 기간통신사업자. 광고 수신동의 재확인 주기. CPO 개인정보보호 경력입니다. 고유식별정보 조사 2년은 구법이고 현행은 3년입니다.",
"3년. 개인정보 보호 기본계획 주기. 보호위원회 위원 임기. 접근권한 기록 보관. ISMS-P 유효기간. 고유식별정보 안전조치 조사 주기. 징벌 과징금 반복위반 기간. 소비자단체 등록 기간과 비영리단체 활동 기간. 영향평가기관 지정 유효기간입니다.",
"4년. CPO 경력 합산 기준입니다.",
"이제 인원입니다. 9명은 개인정보 보호위원회. 30명 이내는 분쟁조정위원회이고 20명은 구법. 50명 이상은 집단분쟁조정 피해 정보주체이고 신청인은 제외. 100명 이상은 비영리단체 단체소송 요청 정보주체입니다.",
"1천 명 이상. 유출등 신고 기준, 그리고 소비자단체 정회원 기준입니다. 홈페이지 30일 게재 요건이 아닙니다. 5천 명 이상은 비영리단체 상시 구성원입니다.",
"1만 명. 내부관리계획을 생략할 수 있는 소상공인 기준은 1만 명 미만. 손해배상 보장 의무 정보주체 기준은 1만 명 이상. ISMS 의무 학교 재학생 기준. 공공기관 고유식별정보 조사 대상 기준입니다.",
"2만 명. CPO 전문성과 신고 요건의 대학 재학생 기준입니다. ISMS 학교 기준 1만 명과 혼동하지 마세요.",
"5만 명. 민감정보와 고유식별정보 기준입니다. 영향평가 대상, 수집출처와 이용내역 통지, 접속기록 2년 보관, 민간 고유식별정보 조사, CPO 요건에 모두 쓰입니다.",
"50만 명은 영향평가 연계 파일. 100만 명은 영향평가 일반 파일, 수집출처와 이용내역 통지, 국내대리인 일평균 정보주체, ISMS 일평균 이용자, CPO 요건입니다. 1천만 명은 징벌적 과징금 대규모 피해 기준입니다. 징벌 과징금에 100만 명이라고 하면 오답입니다.",
"이제 금액입니다. 300만 원은 법정손해배상 상한. 1천만 원은 과태료 최하 구간으로 처리방침 미공개 등. 3천만 원은 과태료 중간 구간으로 14세 동의, 안전조치, 유출 통지 신고, 열람 거절, CPO 미지정과 미의결과 미신고, 시정명령 불이행이고, 제72조 벌금도 3천만 원. 5천만 원은 과태료 최고 구간으로 영상기기 금지장소 설치와 이동형 위반 촬영 두 가지뿐이고, 제71조 벌금도 5천만 원. 1억 원은 제70조 벌금입니다.",
"10억 원은 손해배상 보장 의무 매출 기준, 현행입니다. 20억 원은 일반 과징금 산정 곤란 시 상한. 50억 원은 징벌 과징금 산정 곤란 시 상한. 100억 원은 국내대리인과 ISMS 의무의 정보통신서비스 부문 매출 기준입니다.",
"1,500억 원은 ISMS 의무 상급종합병원과 학교의 매출 세입 기준입니다. CPO 기준은 2026년 9월 11일부터 1,800억 원 초과로 바뀌었으니, CPO에 1,500억이 나오면 오답입니다. 1조 원은 국내대리인 전체 매출 기준입니다.",
"마지막으로 배수와 비율입니다. 3퍼센트는 일반 과징금, 전체 매출액 기준이고 관련 매출 3퍼센트는 구법. 10퍼센트는 징벌적 과징금. 20, 30, 15퍼센트는 과징금 감경 상한으로 자율규약, ISMS-P, 보호수준평가 순서. 40퍼센트는 사전 보호투자 감경 최대이자 CPPG 과목 과락선. 60퍼센트는 CPPG 총점 합격선. 5배는 징벌적 손해배상이고 3배는 구법. 4퍼센트 또는 2천만 유로는 GDPR 과징금 상한입니다."
]},
{title:"9장. 함정 패턴과 마지막 1주", paras:[
"오답 선택지는 정답 조문에서 한 단어만 바꾼 것입니다. 일곱 가지 패턴이 오답의 대부분을 만듭니다.",
"첫째, 주체 바꾸기. 기본계획을 국무총리가, 시행계획을 보호위원회가, 국외이전 중지를 과기정통부가 한다고 바꿉니다. 정답은 보호위원회, 중앙행정기관의 장, 보호위원회입니다. 행정안전부나 방송통신위원회가 주체로 나오면 2020년 이전 이야기이므로 오답입니다.",
"둘째, 기한 바꾸기. 열람 30일, 유출 신고 24시간, 조정 90일. 정답은 10일, 72시간, 60일입니다.",
"셋째, 신 구 조문 섞기. 조정안 무응답은 거부, 손해배상 3배, 관련 매출 3퍼센트, 유출등은 분실 도난 유출만, 동의 없는 수집 5년 5천만 또는 과태료 5천만, 접속기록 월 1회 점검, 고유식별 조사 2년, 안내판 미설치 1천만, 영향평가서 완료 후 2개월, CPO 1,500억. 이 말들이 보이면 모두 구법입니다. 현행은 수락, 5배, 전체 매출 3퍼센트, 위조 변조 훼손 포함, 과징금, 내부관리계획에 정한 주기, 3년, 시정명령 후 불이행 시 3천만, 운용 변경 전 제출, 1,800억 초과입니다.",
"넷째, 공공과 민간 혼동. 민간도 개인정보파일 등록, 민간도 영향평가 의무, 민간도 관보 게재. 모두 공공기관만 합니다.",
"다섯째, 동의로 다 된다는 함정. 주민등록번호를 동의로 처리, 위탁이나 양도에 동의 필요, 민감정보를 일반 동의에 포함. 주민번호는 법정주의, 위탁과 양도는 공개와 통지, 민감정보는 별도 동의입니다.",
"여섯째, 범위 늘리기. 사망자도 개인정보, 카드번호도 고유식별정보, 미성년자 전체 법정대리인 동의, 익명정보에 특례 적용, 가명정보로 마케팅. 정답은 살아 있는 개인, 고유식별정보는 4개만, 14세 미만, 익명정보는 적용 제외, 가명정보는 세 가지 목적만입니다.",
"일곱째, 역할 뒤바꾸기. IDS가 차단하고 IPS가 탐지, 공개키가 더 빠름, 비밀번호 양방향 암호화, 익명보다 가명 우선. 모두 반대입니다.",
"시험 당일 풀이 요령입니다. 옳지 않은 것을 묻는다면 숫자, 주체, 그리고 만, 도, 모두, 어떠한 경우에도 같은 한정어부터 봅니다. 극단적 표현이 들어간 선택지가 오답일 확률이 높습니다. 정보통신서비스 제공자는, 으로 시작하는 선택지는 2023년 폐지된 특례일 확률이 높습니다. 개정 전후가 헷갈리면 더 강화된 쪽, 즉 수락, 5배, 10퍼센트, 위조 변조 포함, 모든 처리자가 현행법입니다. 마킹 전에 과목별로 빈칸이 없는지 확인하세요. 빈칸은 과락으로 직결됩니다.",
"마지막 1주 체크리스트입니다. D-7, 반복학습 앱에서 실전 모의고사 100문항을 120분 안에 풀고 70점 미만 과목을 표시합니다. D-6과 D-5, 표시한 과목의 노트를 다시 읽고 오답노트 문항을 3회 연속 정답까지 돌립니다. D-4, 숫자 총정리를 가린 상태로 빈칸 채우기를 합니다. 이 오디오북 8장을 들으면서 숫자를 먼저 말해 보세요. D-3, 2026 개정 핫스팟을 한 번 더 보고, 개인정보위 보도자료에서 10월과 11월 신규 개정이 있는지 확인합니다. D-2, 두 번째 모의고사로 과목별 40퍼센트와 총점 60퍼센트를 확인합니다. D-1, 함정 패턴과 동의 고지사항 비교만 봅니다. 새 내용은 읽지 않습니다. 시험 당일, 신분증, 수험표, 시계를 챙기고 입실 시간을 확인합니다. 숫자표는 입실 직전 5분만 봅니다.",
"이 오디오북의 법령 기준일은 2026년 10월 25일입니다. 시험 전에 개인정보 보호위원회와 한국CPO포럼 공고에서 추가 개정 여부를 한 번 더 확인하세요. 합격을 응원합니다."
]}
];

</script>
<script>
(function(){
const BOOK=window.CPPG_AUDIOBOOK||[];
const $=id=>document.getElementById(id);
const KEY='cppg_audio_v1';
const CPS=5.2; // 한국어 1.0× 평균 초당 글자 수(추정)
let st={ch:0,p:0,rate:1,voice:'',done:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

const synth=window.speechSynthesis;
let playing=false, utter=null, voices=[];
const supported=!!synth && 'SpeechSynthesisUtterance' in window;

function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function chLen(c){return c.paras.reduce((a,p)=>a+p.length,0)}
function secs(chars){return chars/CPS/st.rate}

function loadVoices(){
  voices=(synth?synth.getVoices():[]).filter(v=>/^ko/i.test(v.lang));
  const sel=$('voice'); sel.innerHTML='';
  if(!voices.length){
    sel.innerHTML='<option>한국어 음성 없음</option>';
    showNotice('이 기기에 한국어 음성이 없습니다. Windows: 설정 → 시간 및 언어 → 음성 → 음성 추가 → 한국어. Android: 설정 → 일반 → TTS 출력 → Google 음성 → 한국어 데이터 설치. iPhone·Mac은 기본 내장(유나)입니다.');
    return;
  }
  voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name.replace(/Microsoft |Google /,'')+(v.localService?'':' (온라인)');sel.appendChild(o)});
  if(!voices.some(v=>v.name===st.voice)){
    const pref=voices.find(v=>/Heami|SunHi|InJoon|Yuna|Google/.test(v.name))||voices[0]; st.voice=pref.name;
  }
  sel.value=st.voice; $('notice').hidden=!!voices.length||$('notice').hidden;
}
function showNotice(t){$('notice').textContent=t;$('notice').hidden=false}

function renderChapters(){
  const box=$('chapters'); box.innerHTML='';
  BOOK.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='ch'+(st.done[i]?' done':''); b.type='button';
    b.setAttribute('aria-current',i===st.ch?'true':'false');
    b.innerHTML='<span class="n">'+String(i).padStart(2,'0')+'</span><span class="t"></span><span class="d">'+fmt(secs(chLen(c)))+'</span>';
    b.querySelector('.t').textContent=c.title;
    b.onclick=()=>{jump(i,0);play()};
    box.appendChild(b);
  });
}
function renderScript(){
  const c=BOOK[st.ch]; const box=$('script'); box.innerHTML='';
  $('scriptHead').textContent='대본 — '+c.title;
  c.paras.forEach((t,i)=>{
    const d=document.createElement('div'); d.className='p'; d.setAttribute('aria-current',i===st.p?'true':'false');
    d.innerHTML='<span class="ix">'+(i+1)+'/'+c.paras.length+'</span>'; d.appendChild(document.createTextNode(t));
    d.onclick=()=>{st.p=i;save();if(playing){speakCurrent()}else{updateNow()}};
    box.appendChild(d);
  });
}
function updateNow(){
  const c=BOOK[st.ch];
  $('npLabel').textContent=(playing?'재생 중':'일시정지')+' · '+(st.p+1)+'/'+c.paras.length+' 문단';
  $('npTitle').textContent=c.title;
  const before=c.paras.slice(0,st.p).reduce((a,p)=>a+p.length,0), tot=chLen(c);
  const pct=tot?Math.round(before/tot*100):0;
  $('bar').style.width=pct+'%'; $('prog').setAttribute('aria-valuenow',pct);
  $('tCur').textContent=fmt(secs(before)); $('tTot').textContent=fmt(secs(tot));
  document.querySelectorAll('.ch').forEach((el,i)=>el.setAttribute('aria-current',i===st.ch?'true':'false'));
  document.querySelectorAll('.p').forEach((el,i)=>{el.setAttribute('aria-current',i===st.p?'true':'false')});
  const cur=document.querySelector('.p[aria-current="true"]'); if(cur&&playing) cur.scrollIntoView({block:'center',behavior:'smooth'});
  $('bPlay').textContent=playing?'❚❚':'▶'; $('bPlay').setAttribute('aria-label',playing?'일시정지':'재생');
}

function speakCurrent(){
  if(!supported) return;
  synth.cancel();
  const c=BOOK[st.ch]; const text=c.paras[st.p];
  utter=new SpeechSynthesisUtterance(text);
  const v=voices.find(x=>x.name===st.voice); if(v){utter.voice=v;utter.lang=v.lang}else{utter.lang='ko-KR'}
  utter.rate=st.rate; utter.pitch=1;
  const this_u=utter;
  utter.onend=()=>{ if(!playing||utter!==this_u) return; advance(); };
  utter.onerror=e=>{ if(e.error==='interrupted'||e.error==='canceled') return; showNotice('음성 재생 오류: '+e.error); playing=false; updateNow(); };
  playing=true; updateNow(); save();
  synth.speak(utter);
  // Chrome: 긴 발화 중단 방지용 keep-alive
  keepAlive();
}
let ka=null;
function keepAlive(){ clearInterval(ka); ka=setInterval(()=>{ if(!playing){clearInterval(ka);return} if(synth.speaking&&!synth.paused){synth.pause();synth.resume()} },10000); }

function advance(){
  const c=BOOK[st.ch];
  if(st.p<c.paras.length-1){ st.p++; speakCurrent(); return; }
  st.done[st.ch]=true;
  if($('auto').checked && st.ch<BOOK.length-1){ st.ch++; st.p=0; renderChapters(); renderScript(); speakCurrent(); }
  else { playing=false; st.p=0; save(); renderChapters(); updateNow(); }
}
function play(){ if(!supported){showNotice('이 브라우저는 음성 합성을 지원하지 않습니다. Chrome, Edge, Safari에서 열어 주세요.');return} if(!voices.length) loadVoices(); speakCurrent(); }
function pause(){ playing=false; synth.cancel(); clearInterval(ka); updateNow(); save(); }
function jump(ch,p){ st.ch=ch; st.p=p; save(); renderChapters(); renderScript(); updateNow(); }

$('bPlay').onclick=()=>playing?pause():play();
$('bNext').onclick=()=>{ const c=BOOK[st.ch]; if(st.p<c.paras.length-1){st.p++} else if(st.ch<BOOK.length-1){jump(st.ch+1,0)} if(playing) speakCurrent(); else updateNow(); save(); };
$('bPrev').onclick=()=>{ if(st.p>0){st.p--} else if(st.ch>0){jump(st.ch-1,BOOK[st.ch-1].paras.length-1)} if(playing) speakCurrent(); else updateNow(); save(); };
$('bNextCh').onclick=()=>{ if(st.ch<BOOK.length-1){ jump(st.ch+1,0); if(playing) speakCurrent(); } };
$('bPrevCh').onclick=()=>{ if(st.ch>0){ jump(st.ch-1,0); if(playing) speakCurrent(); } };
$('prog').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); const f=(e.clientX-r.left)/r.width; const c=BOOK[st.ch]; const tot=chLen(c); let acc=0,idx=0; for(let i=0;i<c.paras.length;i++){acc+=c.paras[i].length; if(acc/tot>=f){idx=i;break}} st.p=idx; if(playing) speakCurrent(); else updateNow(); save(); };
document.querySelectorAll('.speed button').forEach(b=>{ b.setAttribute('aria-pressed',+b.dataset.r===st.rate?'true':'false'); b.onclick=()=>{ st.rate=+b.dataset.r; document.querySelectorAll('.speed button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); save(); renderChapters(); if(playing) speakCurrent(); else updateNow(); }; });
$('voice').onchange=e=>{ st.voice=e.target.value; save(); if(playing) speakCurrent(); };
document.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return; if(e.code==='Space'){e.preventDefault();$('bPlay').click()} if(e.key==='ArrowRight'){$('bNext').click()} if(e.key==='ArrowLeft'){$('bPrev').click()} });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&playing&&!synth.speaking){ speakCurrent(); } });

if(supported){ loadVoices(); synth.onvoiceschanged=loadVoices; setTimeout(loadVoices,800); }
else showNotice('이 브라우저는 음성 합성을 지원하지 않습니다. Chrome, Edge, Safari에서 열어 주세요.');
if(st.ch>=BOOK.length) st.ch=0; if(st.p>=BOOK[st.ch].paras.length) st.p=0;
renderChapters(); renderScript(); updateNow();
})();
</script>

</body></html>
